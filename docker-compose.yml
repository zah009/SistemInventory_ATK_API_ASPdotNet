services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: atk-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql
    healthcheck:
      # Cek SQL Server benar-benar siap nerima koneksi, bukan cuma container-nya jalan.
      # -C = trust server certificate (dibutuhkan sqlcmd versi baru di image mssql-tools18).
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./Atk
      dockerfile: Dockerfile
    container_name: atk-api
    depends_on:
      db:
        # ⚠️ FIX: sebelumnya cuma "- db" (array biasa), itu cuma nunggu
        # container db START, BUKAN nunggu SQL Server siap. Dengan
        # condition: service_healthy, container api baru dijalankan setelah
        # healthcheck di atas lulus -> menghindari crash "connection refused"
        # saat db.Database.Migrate() dipanggil di Program.cs.
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=db;Database=AtkDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "AtkApi"
      Jwt__Audience: "AtkUsers"

volumes:
  sqlserverdata: